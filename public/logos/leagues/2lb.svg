<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- LEON Вторая Лига Б -->
  <defs>
    <style>
      .txt-leon { font-family: 'Unbounded', 'Impact', 'Arial Black', sans-serif; font-weight: 900; font-style: italic; }
      .txt-liga { font-family: 'Unbounded', 'Impact', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 2px; }
    </style>
  </defs>
  
  <!-- Верхний шеврон-пятиугольник Лиги (Красный) -->
  <polygon points="100,10 178,54 150,136 50,136 22,54" fill="#e11d27" stroke="#e11d27" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Белый шеврон вверху пятиугольника -->
  <polygon points="100,28 160,64 144,78 100,52 56,78 40,64" fill="#ffffff"/>
  
  <!-- Белая цифра 2 -->
  <path d="M 76,74 C 76,60 86,52 100,52 C 114,52 124,60 124,72 C 124,84 114,94 98,104 L 126,104 L 126,116 L 74,116 L 74,106 L 98,88 C 108,80 112,76 112,70 C 112,65 107,62 100,62 C 93,62 88,66 88,72 Z" fill="#ffffff"/>
  
  <!-- Белая полочка под цифрой 2 -->
  <polygon points="68,126 132,126 140,134 60,134" fill="#ffffff"/>
  
  <!-- Надпись LEON -->
  <g transform="translate(10, 168)">
    <!-- L -->
    <path d="M 12,0 L 26,-28 L 38,-28 L 29,-8 L 48,-8 L 45,0 Z" fill="#111113"/>
    <!-- E -->
    <path d="M 48,0 L 62,-28 L 88,-28 L 85,-21 L 69,-21 L 66,-16 L 81,-16 L 78,-9 L 63,-9 L 59,0 Z" fill="#111113"/>
    <!-- O (Футбольный мяч) -->
    <g transform="translate(104, -14)">
      <circle cx="0" cy="0" r="14.5" fill="#ffffff" stroke="#111113" stroke-width="1.5"/>
      <polygon points="0,-4 3.8,-1.2 2.3,3.2 -2.3,3.2 -3.8,-1.2" fill="#e11d27"/>
      <!-- Сегменты мяча -->
      <path d="M 0,-4 L 0,-13.5 M 3.8,-1.2 L 12.5,-4.5 M 2.3,3.2 L 8,11.5 M -2.3,3.2 L -8,11.5 M -3.8,-1.2 L -12.5,-4.5" stroke="#e11d27" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#e11d27" stroke-width="2"/>
    </g>
    <!-- N -->
    <path d="M 126,0 L 140,-28 L 152,-28 L 141,-9 L 159,-28 L 171,-28 L 157,0 L 145,0 L 156,-19 L 138,0 Z" fill="#111113"/>
  </g>
  
  <!-- Надпись ЛИГА Б -->
  <text x="100" y="218" text-anchor="middle" fill="#e11d27" class="txt-liga" font-size="28">ЛИГА Б</text>
</svg>
