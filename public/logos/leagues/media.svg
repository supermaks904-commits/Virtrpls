<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Winline MFL (Медийная Футбольная Лига) -->
  <defs>
    <style>
      .mfl-winline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Внешний щит MFL -->
  <path d="M 30,12 C 18,12 10,22 10,36 L 10,140 C 10,185 100,228 100,228 C 100,228 190,185 190,140 L 190,36 C 190,22 182,12 170,12 Z" fill="#0c0d10" stroke="#22232a" stroke-width="2"/>
  
  <!-- Внутренняя белая рамка шеврона -->
  <path d="M 36,20 C 26,20 20,28 20,38 L 20,136 C 20,175 100,216 100,216 C 100,216 180,175 180,136 L 180,38 C 180,28 174,20 164,20 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95"/>

  <!-- Верхняя капсула Winline -->
  <g transform="translate(100, 42)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#202228" stroke="#ffffff" stroke-width="2.5"/>
    <text x="-16" y="5" text-anchor="middle" fill="#ffffff" class="mfl-winline" font-size="14" letter-spacing="0.5">Winline</text>
    <circle cx="48" cy="0" r="9" fill="#ff5a00"/>
  </g>

  <!-- Монограмма M F L -->
  <g transform="translate(100, 134)" fill="#ffffff">
    <!-- M -->
    <path d="M -72,-56 L -50,-56 L -50,6 L -40,-16 L -40,-56 L -20,-56 L -20,18 L -34,18 L -44,-4 L -44,18 L -72,18 Z"/>
    <!-- F -->
    <path d="M -16,-56 L 22,-56 L 22,-36 L 0,-36 L 0,-24 L 18,-24 L 18,-6 L 0,-6 L 0,22 L -16,22 Z"/>
    <!-- L -->
    <path d="M 28,-56 L 44,-56 L 44,4 L 68,4 L 68,22 L 28,22 Z"/>
    
    <!-- Четырехконечная звезда-вспышка у буквы L -->
    <path d="M 62,-28 Q 62,-16 68,-14 Q 62,-12 62,0 Q 62,-12 56,-14 Q 62,-16 62,-28 Z" fill="#ffffff"/>
  </g>
</svg>
