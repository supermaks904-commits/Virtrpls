<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Кубок России (Золотой трофей) -->
  <defs>
    <radialGradient id="cupBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#b8161f"/>
      <stop offset="70%" stop-color="#7a0c12"/>
      <stop offset="100%" stop-color="#4a0408"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="40%" stop-color="#f39c12"/>
      <stop offset="70%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d68910"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="25%" stop-color="#f5d76e"/>
      <stop offset="55%" stop-color="#e5a823"/>
      <stop offset="100%" stop-color="#b7791f"/>
    </linearGradient>
  </defs>

  <!-- Округлый изогнутый щит -->
  <path d="M 100,15 C 160,15 185,45 185,100 C 185,155 160,185 100,185 C 40,185 15,155 15,100 C 15,45 40,15 100,15 Z" fill="url(#cupBg)" stroke="url(#goldBorder)" stroke-width="8"/>

  <!-- Золотой кубок -->
  <g transform="translate(100, 100)">
    <!-- Чаша кубка -->
    <path d="M -54,-50 C -40,-48 40,-48 54,-50 C 44,-10 24,18 0,26 C -24,18 -44,-10 -54,-50 Z" fill="url(#goldTrophy)"/>
    <ellipse cx="0" cy="-50" rx="54" ry="12" fill="#8f1017" stroke="url(#goldBorder)" stroke-width="2"/>
    
    <!-- Медальон с лавровым венком на кубке -->
    <circle cx="0" cy="-28" r="10" fill="#8f1017" stroke="url(#goldBorder)" stroke-width="1.5"/>
    <circle cx="0" cy="-28" r="7" fill="none" stroke="#f5d76e" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Изогнутая граненая талия кубка -->
    <path d="M -16,22 C -6,34 6,34 16,22 C 34,42 22,60 18,65 L -18,65 C -22,60 -34,42 -16,22 Z" fill="url(#goldTrophy)"/>
    
    <!-- Основание кубка -->
    <path d="M -30,65 L 30,65 L 25,82 L -25,82 Z" fill="url(#goldBorder)"/>
  </g>
</svg>
