        const r = await api('/admin/ask', { fid: f.id, question: $('#q').value });
        $('#ans').innerHTML = `<div class="qa">${e(r.answer)}</div>`;

      }
    };
  }
}

/* ───── тактическое футбольное поле для сборных ───── */
function renderSoccerPitch11(players, coach) {
  if (!players || !players.length) {
    return '<div class="empty panel">Символическая сборная формируется после сыгранных матчей.</div>';
  }

  const gkList = players.filter(p => ['ВР', 'GK'].includes(p.pos));
  const defList = players.filter(p => ['ЦЗ', 'ЛЗ', 'ПЗ', 'DEF', 'CB', 'LB', 'RB'].includes(p.pos));
  const midList = players.filter(p => ['ОП', 'ЦП', 'АП', 'MID', 'DM', 'CM', 'AM'].includes(p.pos));
  const fwdList = players.filter(p => ['ЛВ', 'ПВ', 'ЦФ', 'НАП', 'FWD', 'ST', 'LW', 'RW'].includes(p.pos));

  const remaining = players.filter(p => !gkList.includes(p) && !defList.includes(p) && !midList.includes(p) && !fwdList.includes(p));
  while (gkList.length < 1 && remaining.length) gkList.push(remaining.shift());
  while (defList.length < 4 && remaining.length) defList.push(remaining.shift());
  while (midList.length < 3 && remaining.length) midList.push(remaining.shift());
  while (fwdList.length < 3 && remaining.length) fwdList.push(remaining.shift());

  const pCard = p => {
    if (!p) return '<div class="pitch-player" style="visibility:hidden"></div>';
    const tLogo = p.teamLogo || teamLogo(p.team);
    const rat = p.rating ? (+p.rating).toFixed(1) : (p.avgRating ? (+p.avgRating).toFixed(1) : '7.5');
    const statText = p.stat || (p.g ? `${p.g}Г ${p.a || 0}П` : (p.sv ? `${p.sv} сейвов` : (p.tk ? `${p.tk} отб.` : '')));
    return `
    <div class="pitch-player">
      <div class="pitch-player-avatar">
        ${tLogo ? `<img src="${tLogo}" alt=""/>` : '⚽'}
        <div class="pitch-player-rating">${rat}</div>
      </div>
      <div class="pitch-player-name">${e(p.n || p.name)}</div>
      <div class="pitch-player-team">${e(p.team)} · ${e(p.pos)}</div>
      ${statText ? `<div class="pitch-player-stat">${e(statText)}</div>` : ''}
    </div>`;
  };

  return `
  ${coach ? `
  <div class="panel" style="display:flex;align-items:center;gap:14px;background:var(--soft);border-left:4px solid var(--green2);margin-bottom:12px">
    <div style="font-size:32px">👔</div>
    <div style="flex:1">
      <div class="row" style="gap:6px;margin-bottom:2px">
        <span class="tag" style="background:#ffd700;color:#453300;font-weight:700">${e(coach.title || 'Тренер сборной')}</span>
        <span class="tag">${e(coach.teamName)}</span>
      </div>
      <h3 style="margin:0">${e(coach.coach?.name || coach.name)}</h3>
      <div class="small muted">${e(coach.coach?.styleTitle || coach.style || '')} · <i>${e(coach.reason || coach.coach?.quote || '')}</i></div>
    </div>
  </div>` : ''}
  <div class="pitch-container">
    <div class="pitch-center-circle"></div>
    <div class="pitch-center-line"></div>
    <div class="pitch-penalty-top"></div>
    <div class="pitch-penalty-bottom"></div>
    <!-- 3 НАПАДАЮЩИХ (FWD) -->
    <div class="pitch-row">
      ${(fwdList.slice(0, 3).length ? fwdList.slice(0, 3) : [null, null, null]).map(pCard).join('')}
    </div>
    <!-- 3 ПОЛУЗАЩИТНИКА (MID) -->
    <div class="pitch-row">
      ${(midList.slice(0, 3).length ? midList.slice(0, 3) : [null, null, null]).map(pCard).join('')}
    </div>
    <!-- 4 ЗАЩИТНИКА (DEF) -->
    <div class="pitch-row">
      ${(defList.slice(0, 4).length ? defList.slice(0, 4) : [null, null, null, null]).map(pCard).join('')}
    </div>
    <!-- 1 ВРАТАРЬ (GK) -->
    <div class="pitch-row">
      ${pCard(gkList[0] || players[0])}
    </div>
  </div>`;
}

  if (CT === 'squad') {
    const gp = { ВР: 0, ЦЗ: 1, ЛЗ: 1, ПЗ: 1, ОП: 2, ЦП: 2, АП: 2, ЛВ: 3, ПВ: 3, ЦФ: 3 };
    const isRpl = c.team.comp === 'rpl';
    const limit = c.legionLimit || { inSquad: 12, onPitch: 7, label: '12+7' };
    const curLegions = c.squad.filter(p => p.isLegionnaire).length;

    const legionBanner = isRpl ? `
      <div class="panel" style="background:${curLegions > limit.inSquad ? '#fef2f2' : '#f0fdf4'};border:1.5px solid ${curLegions > limit.inSquad ? '#f87171' : '#86efac'};margin-bottom:12px">
        <div class="row sp" style="flex-wrap:wrap;gap:8px">
          <div>
            <b style="font-size:15px">Лимит на легионеров в РПЛ: ${limit.label}</b>
            <span class="muted small" style="margin-left:8px">(в заявке до ${limit.inSquad}, на поле до ${limit.onPitch})</span>
          </div>
          <span class="tag" style="font-weight:700;background:${curLegions > limit.inSquad ? '#b91c1c' : '#15803d'};color:#fff">
            Легионеров в заявке: ${curLegions} / ${limit.inSquad}
          </span>
        </div>
        <div class="small muted" style="margin-top:6px;line-height:1.4">
          ℹ️ Граждане стран <b>ЕАЭС и Белоруссии</b> (Белоруссия, Казахстан, Армения, Киргизия) под лимит не подпадают. Российский паспорт не спасает, если игрок уже сыграл за другую национальную сборную (он остаётся легионером).
        </div>
      </div>` : '';

    cb.innerHTML = `
    ${legionBanner}
    <div class="panel"><h3>Добавить игрока</h3><p class="muted small">Начните вводить фамилию. Если игрока нет в базе, нажмите «Создать»: нейросеть заполнит карточку. Игрок из чужой заявки уйдёт на согласование админу.</p>
    <div class="row"><div class="sug" style="flex:1;min-width:240px"><input id="pn" placeholder="Например: Месси" autocomplete="off"><div class="list" id="pl" hidden></div></div><select id="pp" style="width:90px"><option value="">поз.</option>${Object.keys(gp).map(p => `<option>${p}</option>`).join('')}</select><button class="btn" id="padd">Создать и добавить</button></div></div>
    <div class="panel wrap"><table><thead><tr><th class="l">Игрок</th><th>Поз.</th><th>Возраст</th><th class="l">Гражданство / Статус</th><th class="l">Стиль</th><th class="l">Статус</th><th></th></tr></thead><tbody>${c.squad.sort((a, b) => gp[a.pos] - gp[b.pos]).map(p => {
      const leg = p.legionStatus || { label: p.nation || 'Россия', tagClass: 'rus' };
      const legTag = `<span class="tag" style="${leg.tagClass === 'legion' ? 'background:#fee2e2;color:#991b1b;border-color:#fca5a5' : (leg.tagClass === 'eaeu' ? 'background:#f0fdf4;color:#166534;border-color:#bbf7d0' : 'background:#eff6ff;color:#1e40af;border-color:#bfdbfe')}" title="${e(leg.details || '')}">${e(leg.label)}</span>`;
      return `<tr>
        <td class="l"><b>${e(p.name)}</b></td>
        <td>${p.pos}</td>
        <td>${age(p.born)}</td>
        <td class="l">${legTag}</td>
        <td class="l muted small" style="white-space:normal;max-width:320px">${e(p.style)}</td>
        <td class="l">${p.available ? '<span class="tag">готов</span>' : `<span class="tag" style="background:#fde8e6">${p.banLeft > 0 ? 'дисквалификация' : 'травма'}</span>`}</td>
        <td><button class="btn alt sm" data-rm="${p.id}">убрать</button></td>
      </tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">Заявка пуста.</td></tr>'}</tbody></table></div>
    <div class="row"><button class="btn" id="subm">Подать заявку на сезон</button><span class="muted small">${c.squadSubmitted ? 'Заявка подана. Изменения учитываются автоматически.' : 'Пока заявка не подана, в матчи идут все ваши игроки.'}</span></div>
    <div class="panel" style="margin-top:16px">
      <h3>Заявка на трансфер (иностранный игрок)</h3>
      <p class="muted small">Укажите полностью ФИО игрока и сумму/условия — нейросеть сама найдёт позицию, возраст, гражданство и текущий клуб.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input id="tr_name" placeholder="Полностью ФИО игрока" style="flex:2;min-width:220px">
        <input id="tr_fee" placeholder="Сумма и условия" style="flex:1;min-width:180px">
        <button class="btn" id="tr_send">Отправить заявку</button>
      </div>
      <div id="tr_list" style="margin-top:10px"></div>
    </div>`;
    api('/club/transfer-requests').then(r => {
      const box = $('#tr_list');
      if (!box || !r?.requests?.length) return;
      box.innerHTML = `<div class="small muted" style="margin-bottom:6px">Ваши заявки:</div>` + r.requests.map(x => `<div class="row sp" style="padding:4px 0;border-bottom:1px solid var(--line)"><span><b>${e(x.playerName)}</b> (${x.pos}, ${x.age} л., ${e(x.nationality)}, из ${e(x.fromClub)} · ${e(x.fee)})</span><span class="tag">${x.status === 'pending' ? 'На рассмотрении' : x.status === 'approved' ? 'Одобрено' : 'Отклонено'}</span></div>`).join('');
    }).catch(() => {});
    $('#tr_send').onclick = async () => {
      const r = await act(() => api('/club/transfer-request', withT({
        playerName: $('#tr_name').value,
        fee: $('#tr_fee').value
      })), 'Заявка отправлена админу');
      if (r) pgClub(app);
    };

    let t;
    $('#pn').oninput = () => {
      clearTimeout(t);
      t = setTimeout(async () => {
        const v = $('#pn').value.trim();
        if (v.length < 2) return $('#pl').hidden = true;
        const r = await api('/players/search?q=' + encodeURIComponent(v));
        $('#pl').hidden = !r.length;
        $('#pl').innerHTML = r.map(p => `<div data-id="${p.id}">${e(p.name)} <span class="muted small">${p.pos} · ${e(p.team)}</span></div>`).join('');
      }, 220);
    };

    $('#pl').onclick = async ev => {
      const id = ev.target.closest('[data-id]')?.dataset.id;
      if (!id) return;
      $('#pl').hidden = true;
      const r = await act(() => api('/club/squad/add', withT({ playerId: id })));
      if (r) { r.pending ? toast(r.message) : toast('Игрок добавлен'); pgClub(app); }
    };

    $('#padd').onclick = async () => {
      const n = $('#pn').value.trim();
      if (!n) return;
      $('#padd').disabled = true;
      $('#padd').textContent = 'Создаю карточку…';
      const r = await act(() => api('/club/squad/add', withT({ name: n, pos: $('#pp').value })));
      if (r) { r.pending ? toast(r.message) : toast('Игрок добавлен'); pgClub(app); }
      else { $('#padd').disabled = false; $('#padd').textContent = 'Создать и добавить'; }
    };

    cb.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      if (confirm('Убрать игрока из заявки?')) {
        await act(() => api('/club/squad/remove', withT({ playerId: b.dataset.rm })));
        pgClub(app);
      }
    });

    $('#subm').onclick = async () => {
      await act(() => api('/club/squad/submit', withT({})), 'Заявка подана');
      pgClub(app);
    };
    return;
  }

  if (CT === 'transfers') {
    const inc = c.incomingTransfers || [];
    const outg = c.outgoingTransfers || [];

    cb.innerHTML = `
      <div class="panel">
        <div class="row sp" style="margin-bottom:8px">
          <div>
            <h3 style="margin:0">Входящие предложения по вашим игрокам (${inc.length})</h3>
            <p class="muted small" style="margin:4px 0 0">Запросы на покупку или аренду игроков вашего клуба. По регламенту РПЛ сделка состоится только при согласии владельца клуба и администратора.</p>
          </div>
        </div>
        ${inc.length ? inc.map(t => `
          <div class="panel" style="margin-top:10px;border:1.5px solid var(--line);background:#fafdfb">
            <div class="row sp" style="flex-wrap:wrap;gap:8px;margin-bottom:6px">
              <div class="row" style="gap:8px;align-items:center">
                <span class="tag" style="background:#e2e8f0;font-weight:700">${e(t.pos)}</span>
                <b style="font-size:16px">${e(t.pName || t.playerName)}</b>
                <span class="tag" style="background:${t.type === 'loan' ? '#eff6ff;color:#1e40af' : '#f0fdf4;color:#166534'}">${t.type === 'loan' ? 'Аренда' : 'Трансфер'}</span>
              </div>
              <div style="font-size:16px;font-weight:800;color:#0d2f21;background:#fef08a;padding:3px 10px;border-radius:6px;border:1px solid #fde047">
                ${e(t.fee)}
              </div>
            </div>
            <div class="row" style="gap:8px;font-size:13.5px;margin-bottom:8px;align-items:center">
              <span class="muted">Покупатель:</span>
              ${t.toLogo ? `<img class="t-logo sm" src="${t.toLogo}" alt="" style="width:20px;height:20px">` : ''}
              <b>${e(t.toName)}</b>
              <span class="muted small">· Условия: ${e(t.note || 'Стандартные')}</span>
            </div>
            <div class="row sp" style="padding-top:8px;border-top:1px dashed var(--line);align-items:center;flex-wrap:wrap;gap:8px">
              <div class="row" style="gap:6px;align-items:center">
                ${t.adminApproval === 'approved'
                  ? `<span class="tag" style="background:#dcfce7;color:#166534">✅ Администратор одобрил</span>`
                  : `<span class="tag" style="background:#fef3c7;color:#92400e">⏳ Ожидает решения администратора</span>`}
                <span class="muted small">Требуется ваше решение</span>
              </div>
              <div class="row" style="gap:8px">
                <button class="btn sm" data-cl-accept="${t.id}" style="background:#166534;color:#fff">Согласиться на сделку (${e(t.fee)}) ✅</button>
                <button class="btn alt sm" data-cl-reject="${t.id}">Отклонить ❌</button>
              </div>
            </div>
          </div>
        `).join('') : '<div class="empty">Входящих запросов на трансфер ваших игроков сейчас нет.</div>'}
      </div>

      <div class="panel">
        <h3 style="margin:0 0 6px">Исходящие предложения вашего клуба (${outg.length})</h3>
        <p class="muted small" style="margin-bottom:10px">Игроки, которых ваш клуб хочет приобрести или взять в аренду у других клубов РПЛ.</p>
        ${outg.length ? outg.map(t => `
          <div class="row sp" style="padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px">
            <div>
              <div class="row" style="gap:6px;align-items:center">
                <b>${e(t.pName || t.playerName)}</b> <span class="tag">${e(t.pos)}</span>
                <span class="muted">из</span>
                ${t.fromLogo ? `<img class="t-logo sm" src="${t.fromLogo}" alt="" style="width:18px;height:18px">` : ''}
                <b>${e(t.fromName)}</b>
                <span class="tag" style="font-weight:700">${e(t.fee)}</span>
              </div>
              <div class="muted small" style="margin-top:3px">${e(t.note || '')} · Запрос подан: ${e(t.date || '')}</div>
            </div>
            <div class="row" style="gap:6px;flex-wrap:wrap">
              ${t.clubApproval === 'approved'
                ? `<span class="tag" style="background:#dcfce7;color:#166534">✅ Клуб согласился</span>`
                : t.clubApproval === 'rejected'
                ? `<span class="tag" style="background:#fee2e2;color:#991b1b">❌ Клуб отказал</span>`
                : `<span class="tag" style="background:#fef3c7;color:#92400e">⏳ Ожидает ответа клуба</span>`}
              ${t.adminApproval === 'approved'
                ? `<span class="tag" style="background:#dcfce7;color:#166534">✅ Админ одобрил</span>`
                : `<span class="tag" style="background:#fef3c7;color:#92400e">⏳ Ожидает админа</span>`}
            </div>
          </div>
        `).join('') : '<div class="empty">Исходящих активных запросов нет.</div>'}
      </div>

      <div class="panel">
        <h3>Сделать предложение по игроку РПЛ</h3>
        <p class="muted small">Найдите футболиста в чемпионате России и направьте предложение клубу-владельцу и администратору лиги с указанием предложенной суммы.</p>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <div class="sug" style="flex:2;min-width:220px">
            <input id="cl_tr_psearch" placeholder="Начните вводить фамилию игрока..." autocomplete="off">
            <div class="list" id="cl_tr_plist" hidden></div>
          </div>
          <input id="cl_tr_fee" placeholder="Сумма (напр. €6.5M)" value="€5.0M" style="flex:1;min-width:140px">
          <select id="cl_tr_type" style="width:auto;min-width:160px">
            <option value="transfer">Полноценный трансфер</option>
            <option value="loan_0.5">Аренда (0.5 года)</option>
            <option value="loan_1">Аренда (1 год)</option>
          </select>
          <button class="btn" id="cl_tr_submit">Направить предложение</button>
        </div>
        <div id="cl_tr_selected" style="margin-top:8px"></div>
      </div>
    `;

    cb.querySelectorAll('[data-cl-accept]').forEach(b => b.onclick = async () => {
      const r = await act(() => api('/club/transfer/respond', withT({ transferId: b.dataset.clAccept, action: 'approve' })), 'Согласие зафиксировано');
      if (r) pgClub(app);
    });

    cb.querySelectorAll('[data-cl-reject]').forEach(b => b.onclick = async () => {
      const r = await act(() => api('/club/transfer/respond', withT({ transferId: b.dataset.clReject, action: 'reject' })), 'Предложение отклонено');
      if (r) pgClub(app);
    });

    let trSelectedPid = '';
    let trTimer;
    const inpSearch = $('#cl_tr_psearch');
    const boxList = $('#cl_tr_plist');
    const boxSel = $('#cl_tr_selected');

    if (inpSearch && boxList) {
      inpSearch.oninput = () => {
        clearTimeout(trTimer);
        trTimer = setTimeout(async () => {
          const v = inpSearch.value.trim();
          if (v.length < 2) return boxList.hidden = true;
          const r = await api('/players/search?q=' + encodeURIComponent(v));
          boxList.hidden = !r.length;
          boxList.innerHTML = r.map(p => `<div data-id="${p.id}">${e(p.name)} <span class="muted small">${p.pos} · ${e(p.team)}</span></div>`).join('');
        }, 220);
      };

      boxList.onclick = ev => {
        const row = ev.target.closest('[data-id]');
        if (!row) return;
        trSelectedPid = row.dataset.id;
        inpSearch.value = row.textContent.trim();
        boxList.hidden = true;
        if (boxSel) boxSel.innerHTML = `<span class="tag" style="background:#e0f2fe;color:#0369a1">Выбран игрок для предложения</span>`;
      };
    }

    const btnSubmitOffer = $('#cl_tr_submit');
    if (btnSubmitOffer) {
      btnSubmitOffer.onclick = async () => {
        if (!trSelectedPid) return toast('Сначала выберите игрока из списка подсказок');
        const feeVal = $('#cl_tr_fee')?.value || '€5.0M';
        const typeVal = $('#cl_tr_type')?.value || 'transfer';
        const r = await act(() => api('/club/squad/add', withT({
          playerId: trSelectedPid,
          fee: feeVal,
          transferType: typeVal
        })));
        if (r) {
          toast(r.message || 'Предложение направлено');
          pgClub(app);
        }
      };
    }

    return;
  }

  if (!c.upcoming.length) {
    cb.innerHTML = '<div class="empty panel">Ближайших матчей нет. Расписание создаёт админ.</div>';
    return;
  }
  cb.innerHTML = c.upcoming.map(f => {
    const oppLogo = f.oppLogo || teamLogo(f.home === c.team.id ? f.away : f.home);
    return `<div class="panel" data-f="${f.id}">
      <div class="row sp">
        <div class="t-cell">
          ${oppLogo ? `<img class="t-logo md" src="${oppLogo}" alt=""/>` : ''}
          <h3 style="margin:0"><a href="#/match/${f.id}" style="color:inherit;text-decoration:none" title="Открыть подробности матча">${fmtD(f.date)}, ${f.time} · ${e(f.label)} · ${f.home === c.team.id ? 'дома' : 'в гостях'} против ${e(f.opp)}</a></h3>
        </div>
        <span>${f.derby ? '<span class="tag derby">дерби</span> ' : ''}<span class="tag">${f.lineup ? 'состав подан' : 'состав не подан'}</span></span>
      </div>
      <div style="margin-top:10px"><button class="btn alt sm open">Настроить состав, тактику и тренировки</button></div>
      <div class="form"></div>
    </div>`;
  }).join('');

  cb.querySelectorAll('.panel').forEach(p => p.querySelector('.open')?.addEventListener('click', () => {
    const f = c.upcoming.find(x => x.id === p.dataset.f);
    p.querySelector('.open')?.remove();
    lineupForm(p.querySelector('.form'), f, c, withT, app);
  }));
}

function lineupForm(box, f, c, withT, app) {
  const L = f.lineup || c.tactic || f.auto;
  const st = new Set(L.starters || []), bn = new Set(L.bench || []);
  const order = { ВР: 0, ЦЗ: 1, ЛЗ: 1, ПЗ: 1, ОП: 2, ЦП: 2, АП: 2, ЛВ: 3, ПВ: 3, ЦФ: 3 };
  const sq = [...c.squad].sort((a, b) => order[a.pos] - order[b.pos]);
  const isRpl = c.team.comp === 'rpl' || f.comp === 'rpl';
  const limit = c.legionLimit || { inSquad: 12, onPitch: 7, label: '12+7' };

  box.innerHTML = `<label>Схема</label><input class="fm" value="${e(L.formation || '4-3-3')}" style="max-width:140px">
  <label>Состав: выберите 11 в старт и до 9 на скамейку <span class="muted small" data-cnt></span></label>
  <div>${sq.map(p => {
    const leg = p.legionStatus || { label: p.nation || 'Россия', tagClass: 'rus' };
    const legPill = leg.tagClass === 'legion'
      ? `<span class="tag" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5;font-size:10px" title="${e(leg.details || '')}">⚡ Легионер</span>`
      : (leg.tagClass === 'eaeu' ? `<span class="tag" style="background:#f0fdf4;color:#166534;border-color:#bbf7d0;font-size:10px" title="${e(leg.details || '')}">ЕАЭС</span>` : '');
    return `<div class="pick ${p.available ? '' : 'off'}">
      <span class="tag">${p.pos}</span>
      <div style="flex:1;display:flex;align-items:center;gap:6px;overflow:hidden">
        <span>${e(p.name)}</span>
        ${legPill}
        ${p.available ? '' : '<span class="muted small">(недоступен)</span>'}
      </div>
      <select data-p="${p.id}" ${p.available ? '' : 'disabled'}>
        <option value="">—</option>
        <option value="s" ${st.has(p.id) ? 'selected' : ''}>В старте</option>
        <option value="b" ${bn.has(p.id) ? 'selected' : ''}>Скамейка</option>
      </select>
    </div>`;
  }).join('')}</div>
  <label>Тактика — всё, что тренер говорит игрокам перед матчем</label><textarea class="sp1" placeholder="Пишите как есть: установка, настрой, речь. Молчание — тоже речь.">${e(L.speech || '')}</textarea>
  <label>Тренировочный план перед матчем (произвольный текст)</label><textarea class="tr1" placeholder="Например: пн — отдых, вт — прессинг 2 часа, ср — стандарты, чт — разминка, пт — отдых">${e(L.training || '')}</textarea>
  <div class="row" style="margin-top:14px"><button class="btn save">Сохранить</button><span class="muted small">Состав можно менять до начала матча.</span></div>`;

  const cnt = () => {
    const sel = [...box.querySelectorAll('select')];
    const sPids = sel.filter(s => s.value === 's').map(s => s.dataset.p);
    const bPids = sel.filter(s => s.value === 'b').map(s => s.dataset.p);
    const a = sPids.length;
    const b = bPids.length;
    const legOnPitch = sPids.filter(id => {
      const p = c.squad.find(x => x.id === id);
      return p?.isLegionnaire;
    }).length;

    let legionInfo = '';
    if (isRpl) {
      const isOver = legOnPitch > limit.onPitch;
      legionInfo = ` · <span style="font-weight:700;color:${isOver ? '#dc2626' : '#15803d'}">⚡ Легионеров на поле: ${legOnPitch}/${limit.onPitch} (лимит ${limit.label})${isOver ? ' — ПРЕВЫШЕН ЛИМИТ!' : ''}</span>`;
      const saveBtn = box.querySelector('.save');
      if (saveBtn) {
        if (isOver) {
          saveBtn.disabled = true;
          saveBtn.title = `Превышен лимит легионеров на поле (${legOnPitch} из ${limit.onPitch})`;
        } else {
          saveBtn.disabled = false;
          saveBtn.title = '';
        }
      }
    }
    box.querySelector('[data-cnt]').innerHTML = `— старт ${a}/11, скамейка ${b}${legionInfo}`;
  };
  cnt();
  box.addEventListener('change', cnt);

  box.querySelector('.save').onclick = async () => {
    const sel = [...box.querySelectorAll('select')];
    const starters = sel.filter(s => s.value === 's').map(s => s.dataset.p);
    const bench = sel.filter(s => s.value === 'b').map(s => s.dataset.p);
    const r = await act(() => api('/club/lineup', withT({ fid: f.id, formation: box.querySelector('.fm').value, starters, bench, speech: box.querySelector('.sp1').value, training: box.querySelector('.tr1').value })), 'Сохранено');
    if (r) pgClub(app);
  };
}

/* ───── админка ───── */
let AT = 'matches', AF = { comp: 'rpl', round: '' };
async function pgAdmin(app) {
  if (S.me?.role !== 'admin') return location.hash = '#/login';
  const ov = await api('/admin/overview');
  const T = ov.teams;
  const tabs = [
    ['matches', 'Матчи'],
    ['referees', 'Судьи'],
    ['coaches', 'Тренеры и штаб'],
    ['tournaments', 'Турниры'],
    ['clubs', 'Клубы и логотипы'],
    ['players', 'Игроки'],
    ['derbies', 'Дерби'],
    ['transfers', `Трансферы${ov.transfers.length ? ' (' + ov.transfers.length + ')' : ''}`],
    ['budget', 'Бюджет'],
    ['settings', 'Настройки']
  ];
  app.innerHTML = `<h1>Админка</h1><div class="tabs">${tabs.map(([k, t]) => `<button data-a="${k}" class="${k === AT ? 'on' : ''}">${t}</button>`).join('')}</div><div id="ab"></div>`;
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { AT = b.dataset.a; pgAdmin(app); });
  const ab = $('#ab'), re = () => pgAdmin(app);

  if (!ov.keys.gemini && !ov.keys.groq && !ov.keys.openrouter) {
    ab.insertAdjacentHTML('beforebegin', '<div class="warn" style="margin-bottom:12px">Ключей нейросети нет: матчи идут на запасном генераторе, карточки игроков пустые. Добавьте ключ во вкладке «Настройки».</div>');
  }

  if (AT === 'matches') {
    const all = await api(`/fixtures?comp=${AF.comp}`);
    const labels = [...new Set(all.map(f => f.label))];
    if (!AF.round || !labels.includes(AF.round)) AF.round = (all.find(f => f.status !== 'done') || all[all.length - 1] || {}).label || '';
    const list = all.filter(f => f.label === AF.round);
    ab.innerHTML = `<div class="panel"><h3>Сезон</h3><p class="muted small">Сейчас: ${e(ov.settings.season)}, матчей в расписании: ${all.length ? 'есть' : 'нет'}. Расписание строится для РПЛ, ФНЛ, ФНЛ-2, ПФЛ, Медиалиги и Кубка России сразу.</p>
    <div class="row"><input id="sn" value="${e(ov.settings.season)}" style="width:130px" title="Название сезона"><input id="sd" type="date" style="width:170px" title="Дата первого тура"><button class="btn" id="gen">Создать расписание сезона</button></div></div>
    <div class="panel"><div class="row">${(S.st?.comps || []).map(c => `<button class="btn sm ${c.id === AF.comp ? '' : 'alt'}" data-c="${c.id}">${e(c.name)}</button>`).join('')}<select id="rsel" style="max-width:200px">${labels.map(l => `<option ${l === AF.round ? 'selected' : ''}>${e(l)}</option>`).join('')}</select>
    <button class="btn" id="runr">Запустить все матчи этого тура</button></div><p class="muted small">Матчи, где у обеих команд есть заявка (14+ игроков), играются полностью с трансляцией. Остальные получают счёт сразу. Автозапуск по времени включается в «Настройках».</p></div>
    <div class="panel">${list.length ? list.map(f => `<div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:260px">${fxRow(f)}</div><div class="row">${f.status === 'scheduled' ? `<button class="btn sm" data-run="${f.id}">Запуск</button><button class="btn alt sm" data-lu="${f.id}">Составы</button><button class="btn alt sm" data-ed="${f.id}">Дата/счёт</button>` : ''}${['done', 'live', 'queued', 'generating'].includes(f.status) ? `<button class="btn alt sm" data-rs="${f.id}">Сбросить</button>` : ''}</div></div>`).join('') : '<div class="empty">Нет матчей. Создайте расписание сезона.</div>'}</div>`;

    ab.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { AF.comp = b.dataset.c; AF.round = ''; re(); });
    $('#rsel').onchange = ev => { AF.round = ev.target.value; re(); };
    $('#gen').onclick = async () => {
      const force = all.length && confirm('Расписание этого сезона уже есть. Создать заново? Сыгранные матчи пропадут.');
      if (all.length && !force) return;
      const r = await act(() => api('/admin/season', { start: $('#sd').value, name: $('#sn').value, force: 1 }), r => `Создано матчей: ${r.fixtures}`);
      if (r) re();
    };
    $('#runr').onclick = async () => {
      const comp = AF.comp, rd = list[0]?.round;

      if (r) setTimeout(re, 800);
    };
    ab.querySelectorAll('[data-run]').forEach(b => b.onclick = async () => {
      const r = await act(() => api('/admin/run', { fid: b.dataset.run }), r => r.full ? 'Матч запущен, идёт подготовка' : 'Счёт готов');
      if (r) setTimeout(re, 800);
    });
    ab.querySelectorAll('[data-rs]').forEach(b => b.onclick = async () => {
      if (confirm('Сбросить матч? Результат и статистика пропадут.')) {

    ab.querySelectorAll('[data-lu]').forEach(b => b.onclick = async () => {

      const f = all.find(x => x.id === b.dataset.ed);

        m.querySelector('#es').onclick = async () => {

          m.remove(); re();
        };
        m.querySelector('#eg').onclick = async () => {
          await act(() => api('/admin/fixture', { id: f.id, hg: m.querySelector('#eh').value, ag: m.querySelector('#ea').value }), 'Счёт записан');

  else if (AT === 'clubs') {

    function calculateTotalPrizePreview() {
      let sum = 0;
      ab.querySelectorAll('.rpl-prize-amt').forEach(inp => {
        sum += Number(inp.value) || 0;
      });
      ab.querySelectorAll('.cup-prize-amt').forEach(inp => {
        sum += Number(inp.value) || 0;
      });
      const prevEl = document.getElementById('prize_sum_preview');
      if (prevEl) prevEl.textContent = '€' + sum.toLocaleString('ru-RU') + ` (~€${(sum / 1_000_000).toFixed(1)} млн)`;
    }

    function bindBudgetEvents() {
      $('#tab_prz_rpl')?.addEventListener('click', () => {
        prizeTab = 'rpl';
        $('#prz_rpl_box').style.display = 'block';
        $('#prz_cup_box').style.display = 'none';
        $('#tab_prz_rpl').classList.add('on');
        $('#tab_prz_cup').classList.remove('on');
      });
      $('#tab_prz_cup')?.addEventListener('click', () => {
        prizeTab = 'cup';
        $('#prz_rpl_box').style.display = 'none';
        $('#prz_cup_box').style.display = 'block';
        $('#tab_prz_cup').classList.add('on');
        $('#tab_prz_rpl').classList.remove('on');
      });

      $('#btn_autofill_rpl')?.addEventListener('click', () => {
        rplStandings.forEach(rs => {
          const sel = ab.querySelector(`.rpl-prize-sel[data-place="${rs.place}"]`);
          if (sel) sel.value = rs.teamId;
        });
        toast('Команды расставлены по текущей турнирной таблице РПЛ');
      });

      $('#btn_autocalc_cup')?.addEventListener('click', () => {
        cupSuggestions.forEach(cs => {
          const row = ab.querySelector(`tr[data-cup-tid="${cs.teamId}"]`);
          if (row) {
            const sel = row.querySelector('.cup-prize-sel');
            const stage = row.querySelector('.cup-prize-stage');
            const gwins = row.querySelector('.cup-prize-gwins');
            const amt = row.querySelector('.cup-prize-amt');
            const bd = row.querySelector('.cup-prize-breakdown');
            if (sel) sel.value = cs.teamId;
            if (stage) stage.value = cs.stage;
            if (gwins) gwins.value = cs.groupWins;
            if (amt) amt.value = cs.prize;
            if (bd) bd.textContent = cs.breakdown;
          }
        });
        calculateTotalPrizePreview();
        toast('Призовые Кубка рассчитаны по результатам матчей');
      });

      ab.querySelectorAll('.rpl-prize-amt').forEach(inp => {
        inp.oninput = () => {
          const place = inp.dataset.place;
          const val = Number(inp.value) || 0;
          const fmtEl = document.getElementById(`fmt_rpl_${place}`);
          if (fmtEl) fmtEl.textContent = `€${(val / 1_000_000).toFixed(1)}M`;
          calculateTotalPrizePreview();
        };
      });

      ab.querySelectorAll('.cup-prize-amt').forEach(inp => {
        inp.oninput = calculateTotalPrizePreview;
      });

      ab.querySelectorAll('[data-bfilter]').forEach(b => {
        b.onclick = () => {
          teamFilterComp = b.dataset.bfilter;
          renderBudgetView();
        };
      });

      const searchInp = document.getElementById('b_search');
      if (searchInp) {
        searchInp.oninput = e => {
          teamSearchQuery = e.target.value;
          renderBudgetView();
        };
      }

      ab.querySelectorAll('.quick-amt').forEach(b => {
        b.onclick = () => {
          const amtInp = document.getElementById('adj_amt');
          if (amtInp) amtInp.value = b.dataset.val;
        };
      });

      $('#adj_submit')?.addEventListener('click', async () => {
        const teamId = $('#adj_tid').value;
        const mode = $('#adj_mode').value;
        const amount = $('#adj_amt').value;
        const reason = $('#adj_reason').value;
        const r = await act(() => api('/admin/budget/adjust', { teamId, mode, amount, reason }), 'Бюджет обновлен');
        if (r) re();
      });

      ab.querySelectorAll('[data-edit-team]').forEach(b => {
        b.onclick = () => {
          const tid = b.dataset.editTeam;
          const tname = b.dataset.teamName;
          const tbudget = Number(b.dataset.teamBudget) || 0;

          const m = modal(`
            <h3>💰 Корректировка бюджета: ${e(tname)}</h3>
            <div style="background:#f0fdf4;padding:10px 14px;border-radius:8px;border:1px solid #86efac;margin-bottom:14px">
              Текущий баланс клуба: <b style="font-size:18px;color:#166534">€${tbudget.toLocaleString('ru-RU')}</b>
            </div>
            <label>Операция</label>
            <select id="m_adj_mode">
              <option value="add">➕ Добавить к бюджету (+)</option>
              <option value="subtract">➖ Списать со счёта (-)</option>
              <option value="set">🟰 Установить точную сумму (=)</option>
            </select>
            <label>Сумма в евро (€)</label>
            <input type="number" id="m_adj_amt" value="1000000" step="100000">
            <div class="row" style="gap:6px;margin-top:6px">
              <button class="btn sm alt m-q-amt" data-val="500000">+500K</button>
              <button class="btn sm alt m-q-amt" data-val="1000000">+1.0M</button>
              <button class="btn sm alt m-q-amt" data-val="5000000">+5.0M</button>
              <button class="btn sm alt m-q-amt" data-val="10000000">+10.0M</button>
            </div>
            <label>Обоснование / комментарий</label>
            <input id="m_adj_reason" placeholder="Например: Спонсорский контракт">
            <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">
              <button class="btn alt" id="m_adj_cancel">Отмена</button>
              <button class="btn" id="m_adj_save">Сохранить</button>
            </div>
          `, mEl => {
            mEl.querySelector('#m_adj_cancel').onclick = () => m.remove();
            mEl.querySelectorAll('.m-q-amt').forEach(qb => qb.onclick = () => {
              mEl.querySelector('#m_adj_amt').value = qb.dataset.val;
            });
            mEl.querySelector('#m_adj_save').onclick = async () => {
              const mode = mEl.querySelector('#m_adj_mode').value;
              const amount = mEl.querySelector('#m_adj_amt').value;
              const reason = mEl.querySelector('#m_adj_reason').value;
              const res = await act(() => api('/admin/budget/adjust', { teamId: tid, mode, amount, reason }), 'Бюджет клуба обновлён');
              if (res) {
                m.remove();
                re();
              }
            };
          });
        };
      });

      $('#btn_award_prizes_submit')?.addEventListener('click', () => {
        const rplAwards = [];
        ab.querySelectorAll('.rpl-prize-sel').forEach(sel => {
          const place = Number(sel.dataset.place);
          const teamId = sel.value;
          const amtInp = ab.querySelector(`.rpl-prize-amt[data-place="${place}"]`);
          const prize = Number(amtInp?.value) || 0;
          if (teamId && prize > 0) {
            const teamObj = bTeams.find(t => t.id === teamId);
            rplAwards.push({ place, teamId, teamName: teamObj?.name || 'Клуб', prize });
          }
        });

        const cupAwards = [];
        ab.querySelectorAll('#cup_rows_tbody tr').forEach(row => {
          const sel = row.querySelector('.cup-prize-sel');
          const stage = row.querySelector('.cup-prize-stage');
          const gwins = row.querySelector('.cup-prize-gwins');
          const amt = row.querySelector('.cup-prize-amt');
          const teamId = sel?.value;
          const prize = Number(amt?.value) || 0;
          if (teamId && prize > 0) {
            const teamObj = bTeams.find(t => t.id === teamId);
            cupAwards.push({
              teamId,
              teamName: teamObj?.name || 'Клуб',
              stageLabel: stage?.value || 'Кубок России',
              wins: Number(gwins?.value) || 0,
              prize
            });
          }
        });

        const totalAwards = [...rplAwards, ...cupAwards];
        const totalPrizeSum = totalAwards.reduce((a, b) => a + b.prize, 0);

        if (!totalAwards.length) {
          toast('Выберите хотя бы один клуб для начисления', true);
          return;
        }

        const clubMap = {};
        for (const a of rplAwards) {
          clubMap[a.teamId] = clubMap[a.teamId] || { name: a.teamName, rpl: 0, cup: 0, total: 0, details: [] };
          clubMap[a.teamId].rpl += a.prize;
          clubMap[a.teamId].total += a.prize;
          clubMap[a.teamId].details.push(`${a.place} место РПЛ: €${(a.prize / 1_000_000).toFixed(2)}M`);
        }
        for (const a of cupAwards) {
          clubMap[a.teamId] = clubMap[a.teamId] || { name: a.teamName, rpl: 0, cup: 0, total: 0, details: [] };
          clubMap[a.teamId].cup += a.prize;
          clubMap[a.teamId].total += a.prize;
          clubMap[a.teamId].details.push(`Кубок (${a.stageLabel}): €${(a.prize / 1_000_000).toFixed(2)}M`);
        }

        const clubList = Object.values(clubMap).sort((a, b) => b.total - a.total);

        const m = modal(`
          <div class="row sp" style="margin-bottom:12px">
            <h3 style="margin:0;color:#166534">🏆 Подтверждение начисления призовых</h3>
            <button class="btn alt sm" id="m_prz_close">✕</button>
          </div>
          <p class="small muted">
            Проверьте итоговые суммы. Выплат будет начислено для <b>${clubList.length} клубов</b> на общую сумму <b>€${totalPrizeSum.toLocaleString('ru-RU')}</b> (~€${(totalPrizeSum / 1_000_000).toFixed(1)} млн).
          </p>
          <div style="max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin:12px 0;background:#f8fafc">
            ${clubList.map((c, i) => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid #e2e8f0;font-size:13px">
                <div>
                  <b style="font-size:14px">${i + 1}. ${e(c.name)}</b>
                  <div class="small muted">${e(c.details.join(' + '))}</div>
                </div>
                <div style="font-weight:800;color:#15803d;font-size:14px">
                  +€${c.total.toLocaleString('ru-RU')}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="warn small" style="margin-bottom:14px">
            ⚠️ Средства будут немедленно зачислены на балансы клубов, а в журнал аудита будут добавлены официальные бухгалтерские записи.
          </div>
          <div class="row sp" style="margin-top:16px">
            <button class="btn alt" id="m_prz_cancel">Отмена</button>
            <button class="btn" id="m_prz_confirm" style="background:#16a34a;font-weight:800;padding:10px 20px">
              ✅ Подтвердить и начислить призовые
            </button>
          </div>
        `, mEl => {
          mEl.querySelector('#m_prz_close').onclick = () => m.remove();
          mEl.querySelector('#m_prz_cancel').onclick = () => m.remove();
          mEl.querySelector('#m_prz_confirm').onclick = async () => {
            const res = await act(() => api('/admin/budget/award-prizes', { rplAwards, cupAwards }), 'Призовые успешно начислены!');
            if (res) {
              m.remove();
              re();
            }
          };
        });
      });

      calculateTotalPrizePreview();
    }

    renderBudgetView();
  }
  else if (AT === 'settings') {
    const s = ov.settings, k = ov.keys, mo = ov.models || {};
    ab.innerHTML = `<div class="panel"><h3>Код администратора</h3><div class="code">${e(s.adminCode)}</div><p class="muted small">Его можно переопределить переменной окружения ADMIN_CODE.</p></div>
    <div class="panel"><h3>Нейросеть</h3><p class="muted small">Порядок: Gemini → Groq → OpenRouter. Если у одного закончился лимит, запрос уходит к следующему. Ключи можно задать здесь или переменными окружения.</p>
    ${[['gemini', 'Google Gemini (AI Studio)', 'gemini-3.8-flash'], ['groq', 'Groq', 'openai/gpt-oss-120b'], ['openrouter', 'OpenRouter', 'openrouter/free']].map(([n, t, d]) => `<div class="row" style="margin-top:8px"><div style="flex:1;min-width:230px"><label>${t} ${k[n] ? '<span class="tag">ключ есть</span>' : ''}</label><input id="k_${n}" type="password" placeholder="${k[n] ? 'оставьте пустым, чтобы не менять' : 'вставьте ключ'}" autocomplete="off"></div><div style="flex:1;min-width:200px"><label>Модель</label><input id="m_${n}" value="${e(mo[n] || '')}" placeholder="${d}"></div></div>`).join('')}
    <label style="margin-top:10px"><input type="checkbox" id="gr" ${s.grounding ? 'checked' : ''} style="width:auto"> Поиск Google при создании карточек (только Gemini)</label></div>
    <div class="panel"><h3>Трансляция и Telegram</h3><div class="row"><div style="flex:1;min-width:200px"><label>Секунд реального времени на минуту матча</label><input id="spm" type="number" step="0.5" value="${s.secPerMin}"></div><div style="flex:1;min-width:200px"><label>Пауза на перерыве, сек</label><input id="brk" type="number" value="${s.breakSec}"></div></div>
    <div class="row"><div style="flex:1;min-width:220px"><label>Токен Telegram-бота</label><input id="tgt" type="password" value="${e(s.tgToken)}" placeholder="123456:ABC…"></div><div style="flex:1;min-width:200px"><label>ID канала или чата</label><input id="tgc" value="${e(s.tgChat)}" placeholder="@mychannel"></div></div>
    <label>Адрес сайта (для ссылок в Telegram)</label><input id="url" value="${e(s.siteUrl)}" placeholder="https://mysite.ru"></div>
    <div class="panel"><h3>Игра</h3><div class="row"><div style="flex:1;min-width:200px"><label>Максимум игроков в заявке</label><input id="sqm" type="number" value="${s.squadMax}"></div><div style="flex:1;min-width:200px"><label>Запросов на матч</label><select id="chk"><option value="2" ${s.chunks != 6 ? 'selected' : ''}>2 (по таймам)</option><option value="6" ${s.chunks == 6 ? 'selected' : ''}>6 (по 15 минут)</option></select></div></div>
    <label style="margin-top:8px"><input type="checkbox" id="auto" ${s.auto ? 'checked' : ''} style="width:auto"> Автозапуск матчей по расписанию</label></div>
    <div class="panel"><h3>Системный промпт матча</h3><textarea id="sys" style="min-height:220px;font:13px/1.4 ui-monospace,Consolas,monospace">${e(s.systemPrompt)}</textarea></div>
    <div class="row"><button class="btn" id="ssv">Сохранить настройки</button></div>
    <div class="panel" style="margin-top:16px"><h3>Последние запросы к нейросети</h3><div class="wrap"><table><thead><tr><th class="l">Время</th><th class="l">Задача</th><th class="l">Провайдер</th><th>мс</th><th class="l">Результат</th></tr></thead><tbody>${ov.log.map(l => `<tr><td class="l">${new Date(l.ts).toLocaleTimeString('ru-RU')}</td><td class="l">${e(l.task)}</td><td class="l">${e(l.p)}</td><td>${l.ms}</td><td class="l small" style="white-space:normal">${l.ok ? 'ок' : e(l.err)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Пока пусто</td></tr>'}</tbody></table></div></div>`;

    $('#ssv').onclick = async () => {
      const keys = {}, models = {};
      for (const n of ['gemini', 'groq', 'openrouter']) {
        keys[n] = $('#k_' + n).value;
        models[n] = $('#m_' + n).value;
        if (!keys[n]) delete keys[n];
      }
      await act(() => api('/admin/settings', { keys, models, grounding: $('#gr').checked, secPerMin: $('#spm').value, breakSec: $('#brk').value, tgToken: $('#tgt').value, tgChat: $('#tgc').value, siteUrl: $('#url').value, squadMax: $('#sqm').value, chunks: $('#chk').value, auto: $('#auto').checked, systemPrompt: $('#sys').value }), 'Настройки сохранены');
      re();
    };
  }
}

let NT_TAB = 'current';
async function pgNational(app) {
  const isAdmin = S.me?.role === 'admin';
  const [data, plData] = await Promise.all([
    api('/national'),
    isAdmin ? api('/admin/players?q=') : Promise.resolve({ players: [] })
  ]);
  const cur = data.current || { title: 'Ближайшая пауза на матчи сборных', stage: 'extended', extendedPlayers: [], finalPlayers: [], matches: [] };
  const archive = data.archive || [];
  const allPlayers = plData.players || [];

  const activeStage = cur.stage === 'final' ? 'final' : 'extended';
  const activeList = activeStage === 'final' ? (cur.finalPlayers || []) : (cur.extendedPlayers || []);

  const renderPlayersTable = (list, canEdit) => {
    if (!list.length) return '<div class="empty">Состав на ближайшую паузу ещё не опубликован.</div>';
    return `<div class="scroll-hint"><span>👉 Прокручивайте состав вправо</span></div><div class="wrap"><table>
      <thead><tr><th>#</th><th class="l">Игрок</th><th>Поз.</th><th class="l">Клуб</th><th>Матчи</th><th>Голы</th><th>Пасы</th><th>Рейтинг</th>${canEdit ? '<th></th>' : ''}</tr></thead>
      <tbody>
        ${list.map((p, i) => `<tr>
          <td>${i + 1}</td>
          <td class="l"><b>${e(p.name)}</b></td>
          <td><span class="tag">${e(p.pos)}</span></td>
          <td class="l"><div class="t-cell">${p.teamLogo ? `<img class="t-logo" src="${p.teamLogo}" alt=""/>` : ''}<span>${e(p.teamName)}</span></div></td>
          <td>${p.matches || 0}</td>
          <td>${p.goals || 0}</td>
          <td>${p.assists || 0}</td>
          <td><b>${Number(p.rating || 0).toFixed(2)}</b></td>
          ${canEdit ? `<td><button class="btn alt sm" data-nt-rem="${p.id}">Убрать</button></td>` : ''}
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  };

  const breaks = (data.breaks || []).filter(b => b.id.startsWith('ib_'));
  const breakDateOptions = breaks.map(b => {
    const opts = [];
    let curD = b.start;
    while (curD <= b.end) {
      opts.push(`<option value="${curD}">${fmtD(curD)} (${fmtDayOfWeek(curD)})</option>`);
      curD = addDaysStr(curD, 1);
    }
    return `<optgroup label="${e(b.name)} (${fmtD(b.start)} — ${fmtD(b.end)})">${opts.join('')}</optgroup>`;
  }).join('');

  const renderMatches = (matches, canEdit) => {
    if (!matches || !matches.length) return '<div class="empty">Товарищеские матчи на эту паузу ещё не назначены.</div>';
    const rusLogo = '/assets/aistudio/russia_russia-national-team.football-logos.cc_2a5e3ddc.svg';
    return `<div style="display:grid;gap:8px">
      ${matches.map(m => {
        const oppLogo = teamLogo(m.opponent);
        return `<div class="row sp" style="padding:10px 14px;background:var(--soft);border-radius:8px">
        <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap">
          <span class="small muted">${fmtD(m.date)} (${fmtDayOfWeek(m.date)}) · ${e(m.time)}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <img src="${m.home ? rusLogo : (oppLogo || rusLogo)}" alt="" class="t-logo" style="width:24px;height:24px;object-fit:contain"/>
            <b>${m.home ? `Россия — ${e(m.opponent)}` : `${e(m.opponent)} — Россия`}</b>
            <img src="${m.home ? (oppLogo || rusLogo) : rusLogo}" alt="" class="t-logo" style="width:24px;height:24px;object-fit:contain"/>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <span class="tag">Товарищеский матч</span>
          ${canEdit ? `<button class="btn alt sm" data-nt-del-match="${m.id}" title="Удалить матч" style="color:#ef4444;border-color:rgba(239,68,68,0.3)">✕</button>` : ''}
        </div>
      </div>`;
      }).join('')}
    </div>`;
  };

  let body = '';
  if (NT_TAB === 'current') {
    body = `
      <div class="panel">
        <div class="row sp" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <div>
            <h3 style="margin:0">${e(cur.title)}</h3>
            <div class="small muted">${activeStage === 'final' ? 'Итоговый состав (25 игроков)' : 'Расширенный состав (40 игроков)'} · Вызвано: ${activeList.length}</div>
          </div>
          ${isAdmin ? `<div class="row" style="gap:6px">
            <button class="btn ${activeStage === 'extended' ? '' : 'alt'} sm" data-nt-stage="extended">Расширенный (${(cur.extendedPlayers || []).length})</button>
            <button class="btn ${activeStage === 'final' ? '' : 'alt'} sm" data-nt-stage="final">Итоговый (${(cur.finalPlayers || []).length})</button>
          </div>` : ''}
        </div>
        ${renderPlayersTable(activeList, isAdmin)}
      </div>

      <div class="panel">
        <h3 style="margin:0 0 10px">Товарищеские матчи в эту паузу</h3>
        ${renderMatches(cur.matches, isAdmin)}
      </div>

      ${isAdmin ? `
      <div class="panel" style="border:1.5px solid var(--green)">
        <h3 style="margin:0 0 10px">Управление сборной (Админ)</h3>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <input id="nt_title" value="${e(cur.title)}" placeholder="Название паузы (например: Ноябрьский сбор 2026)" style="flex:1;min-width:240px">
          <button class="btn" id="nt_gen_ext">Сформировать расширенный (40) ИИ</button>
          <button class="btn" id="nt_gen_fin">Сформировать итоговый (25) ИИ</button>
          <button class="btn alt" id="nt_arch_btn">В архив</button>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <select id="nt_add_pid" style="flex:1;min-width:240px">
            ${allPlayers.slice(0, 400).map(p => `<option value="${p.id}">${e(p.name)} (${p.pos}, ${e(teamName(p.teamId))})</option>`).join('')}
          </select>
          <button class="btn alt" id="nt_add_btn">Добавить игрока в состав</button>
        </div>
        <div style="margin-bottom:6px;font-size:12px;color:var(--muted)">
          ℹ️ <b>Товарищеские матчи сборной:</b> даты строго ограничены официальными международными окнами ФИФА
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <input id="nt_opp" placeholder="Соперник (например: Сербия, Камерун)" style="flex:2;min-width:180px">
          <select id="nt_date" style="flex:2;min-width:220px">
            ${breakDateOptions || '<option value="2026-11-14">2026-11-14</option>'}
          </select>
          <input id="nt_time" value="19:00" style="width:80px">
          <button class="btn alt" id="nt_add_match">Добавить товарищеский матч</button>
        </div>
      </div>` : ''}`;
  } else {
    body = archive.length ? archive.map(a => {
      const list = (a.finalPlayers && a.finalPlayers.length) ? a.finalPlayers : (a.extendedPlayers || []);
      return `<div class="panel">
        <div class="row sp" style="margin-bottom:10px">
          <b>${e(a.title)}</b>
          <span class="small muted">Архив · ${e(a.archivedAt || '')} · Игроков: ${list.length}</span>
        </div>
        ${renderMatches(a.matches)}
        <div style="margin-top:10px">${renderPlayersTable(list, false)}</div>
      </div>`;
    }).join('') : '<div class="panel"><div class="empty">Архив сборов пуст.</div></div>';
  }

  app.innerHTML = `
  <div class="comp-banner" style="display:flex;align-items:center;gap:18px">
    <img src="/assets/aistudio/russia_russia-national-team.football-logos.cc_2a5e3ddc.svg" alt="Сборная России" class="comp-banner-logo" style="width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25))" onerror="this.style.display='none'"/>
    <div>
      <h1 class="comp-banner-title" style="margin:0">Сборная России</h1>
      <div class="comp-banner-sub">Вызов игроков на международную паузу, товарищеские матчи и архив сборов</div>
    </div>
  </div>
  <div class="tabs" style="margin-bottom:16px">
    <button data-nt-tab="current" class="${NT_TAB === 'current' ? 'on' : ''}">Ближайшая пауза</button>
    <button data-nt-tab="archive" class="${NT_TAB === 'archive' ? 'on' : ''}">Архив (${archive.length})</button>
  </div>
  ${body}`;

  app.querySelectorAll('[data-nt-tab]').forEach(b => b.onclick = () => { NT_TAB = b.dataset.ntTab; pgNational(app); });
  app.querySelectorAll('[data-nt-stage]').forEach(b => b.onclick = async () => {
    await act(() => api('/admin/national/squad', { action: 'stage', stage: b.dataset.ntStage }));
    pgNational(app);
  });
  app.querySelectorAll('[data-nt-rem]').forEach(b => b.onclick = async () => {
    await act(() => api('/admin/national/squad', { action: 'remove', pid: b.dataset.ntRem }), 'Игрок убран из списка');
    pgNational(app);
  });
  if ($('#nt_gen_ext')) $('#nt_gen_ext').onclick = async () => {
    const r = await act(() => api('/admin/national/generate', { stage: 'extended', title: $('#nt_title').value }), 'Расширенный состав (40) сформирован');
    if (r) pgNational(app);
  };
  if ($('#nt_gen_fin')) $('#nt_gen_fin').onclick = async () => {
    const r = await act(() => api('/admin/national/generate', { stage: 'final', title: $('#nt_title').value }), 'Итоговый состав (25) сформирован');
    if (r) pgNational(app);
  };
  if ($('#nt_add_btn')) $('#nt_add_btn').onclick = async () => {
    const r = await act(() => api('/admin/national/squad', { action: 'add', pid: $('#nt_add_pid').value }), 'Игрок добавлен в сборную');
    if (r) pgNational(app);
  };
  if ($('#nt_add_match')) $('#nt_add_match').onclick = async () => {
    const r = await act(() => api('/admin/national/match', { opponent: $('#nt_opp').value, date: $('#nt_date').value, time: $('#nt_time').value, home: true }), 'Товарищеский матч добавлен');
    if (r) pgNational(app);
  };
  app.querySelectorAll('[data-nt-del-match]').forEach(b => b.onclick = async () => {
    await act(() => api('/admin/national/match/delete', { matchId: b.dataset.ntDelMatch }), 'Товарищеский матч удалён');
    pgNational(app);
  });
  if ($('#nt_arch_btn')) $('#nt_arch_btn').onclick = async () => {
    const r = await act(() => api('/admin/national/archive', {}), 'Сбор отправлен в архив');
    if (r) pgNational(app);
  };
}

boot();
</script>
</body>
</html>
