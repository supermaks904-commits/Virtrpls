<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- FONBET Кубок России по футболу -->
  <defs>
    <style>
      .txt-fonbet { font-family: 'Unbounded', 'Impact', sans-serif; font-weight: 900; font-style: italic; }
      .txt-cup-title { font-family: 'Unbounded', 'Impact', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 0.5px; }
      .txt-cup-sub { font-family: 'Unbounded', 'Impact', 'Arial Black', sans-serif; font-weight: 800; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Красный вымпел/щит FONBET -->
  <polygon points="10,10 190,10 190,172 100,230 10,172" fill="#e11d27"/>

  <!-- Силуэт Кубка России -->
  <g transform="translate(100, 72)" fill="#ffffff" stroke="#e11d27" stroke-width="1.5">
    <!-- Крышка кубка с шариком -->
    <circle cx="0" cy="-56" r="4.5" fill="#ffffff" stroke="none"/>
    <path d="M -9,-48 C -9,-53 9,-53 9,-48 L 7,-44 L -7,-44 Z" fill="#ffffff"/>
    
    <!-- Чаша кубка -->
    <path d="M -24,-44 L 24,-44 C 24,-24 16,-6 0,-2 C -16,-6 -24,-24 -24,-44 Z" fill="#ffffff"/>
    
    <!-- Декоративные узоры на чаше (вырезы) -->
    <path d="M -16,-34 Q -12,-38 -8,-34 Q -4,-38 0,-34 Q 4,-38 8,-34 Q 12,-38 16,-34" fill="none" stroke="#e11d27" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-20" rx="4" ry="7" fill="#e11d27"/>
    
    <!-- Ручки кубка -->
    <path d="M -24,-38 C -38,-38 -40,-20 -26,-12 C -22,-10 -20,-12 -20,-16 C -20,-20 -30,-22 -26,-30 C -24,-34 -20,-34 -20,-34" fill="#ffffff" stroke="none"/>
    <path d="M 24,-38 C 38,-38 40,-20 26,-12 C 22,-10 20,-12 20,-16 C 20,-20 30,-22 26,-30 C 24,-34 20,-34 20,-34" fill="#ffffff" stroke="none"/>

    <!-- Ножка кубка -->
    <path d="M -6,-2 L 6,-2 L 12,12 L -12,12 Z" fill="#ffffff"/>
    
    <!-- Основание/подставка -->
    <rect x="-18" y="14" width="36" height="15" rx="2" fill="#ffffff"/>
    <rect x="-10" y="20" width="20" height="9" fill="#e11d27"/>
  </g>

  <!-- Логотип FONBET -->
  <text x="100" y="156" text-anchor="middle" fill="#ffffff" class="txt-fonbet" font-size="28" letter-spacing="0.5">FONBET</text>
  
  <!-- КУБОК РОССИИ -->
  <text x="100" y="180" text-anchor="middle" fill="#ffffff" class="txt-cup-title" font-size="16">КУБОК РОССИИ</text>
  
  <!-- ПО ФУТБОЛУ -->
  <text x="100" y="198" text-anchor="middle" fill="#ffffff" class="txt-cup-sub" font-size="12">ПО ФУТБОЛУ</text>
</svg>
